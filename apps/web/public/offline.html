<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Нет подключения — CRM ремонта</title>
    <meta name="theme-color" content="#1e40af" />
    <style>
      /*
       * Стили встроены, а не вынесены в файл: эта страница должна открыться
       * именно тогда, когда сеть недоступна, поэтому она не может зависеть от
       * загрузки внешнего CSS.
       */
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 24px;
        background: #f8fafc;
        color: #0f172a;
        font-family:
          system-ui,
          -apple-system,
          'Segoe UI',
          Roboto,
          sans-serif;
        text-align: center;
      }
      .card {
        max-width: 26rem;
      }
      .icon {
        width: 56px;
        height: 56px;
        margin: 0 auto 16px;
        border-radius: 50%;
        background: #dbeafe;
        color: #1e40af;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 28px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.25rem;
      }
      p {
        margin: 0 0 20px;
        color: #475569;
        line-height: 1.5;
      }
      button {
        min-height: 48px;
        padding: 0 24px;
        border: 0;
        border-radius: 10px;
        background: #1e40af;
        color: #fff;
        font-size: 1rem;
        font-weight: 500;
        cursor: pointer;
      }
      button:active {
        background: #1d4ed8;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="icon" aria-hidden="true">!</div>
      <h1>Нет подключения</h1>
      <p>
        Данные заказов не показываются без сети: устаревший статус оплаты или выдачи может привести
        к ошибке при работе с клиентом. Проверьте подключение и повторите.
      </p>
      <button type="button" onclick="location.reload()">Повторить</button>
    </div>
  </body>
</html>
