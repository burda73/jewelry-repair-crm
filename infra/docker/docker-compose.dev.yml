# Dev-инфраструктура: PostgreSQL, Redis, MinIO (S3), Mailhog.
# Запуск: npm run infra:up
# Остановка: npm run infra:down
#
# ВАЖНО: это ТОЛЬКО для локальной разработки. В продакшне PostgreSQL —
# СУЩЕСТВУЮЩИЙ сервер предприятия и в Docker не поднимается (ответ A1).
# См. infra/docker/docker-compose.prod.yml и infra/db/README.md.
# Локальный контейнер нужен, чтобы разработчику не требовался доступ к продовой БД.

name: repair-crm-dev

services:
  postgres:
    image: postgres:16-alpine
    container_name: repair-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: repair
      POSTGRES_PASSWORD: repair
      POSTGRES_DB: repair
      # Русская локаль нужна для корректной сортировки ФИО
      POSTGRES_INITDB_ARGS: '--encoding=UTF8 --locale=ru_RU.UTF-8'
      TZ: Europe/Moscow
    ports:
      - '5432:5432'
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
      - ./init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U repair -d repair']
      interval: 10s
      timeout: 5s
      retries: 5
    command:
      - postgres
      # pg_trgm нужен для нечёткого поиска по ФИО (docs/03-data-model.md §4)
      - -c
      - shared_preload_libraries=pg_trgm
      - -c
      - log_min_duration_statement=500

  redis:
    image: redis:7-alpine
    container_name: repair-redis
    restart: unless-stopped
    ports:
      - '6379:6379'
    volumes:
      - ./data/redis:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy noeviction

  minio:
    image: minio/minio:latest
    container_name: repair-minio
    restart: unless-stopped
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - '9000:9000' # API
      - '9001:9001' # веб-консоль
    volumes:
      - ./data/minio:/data
    healthcheck:
      test: ['CMD', 'mc', 'ready', 'local']
      interval: 10s
      timeout: 5s
      retries: 5
    command: server /data --console-address ":9001"

  # Создаёт бакеты при первом запуске (docs/05-integrations.md §4)
  minio-init:
    image: minio/mc:latest
    container_name: repair-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 minioadmin minioadmin &&
      mc mb --ignore-existing local/repair-photos &&
      mc mb --ignore-existing local/repair-calls &&
      mc mb --ignore-existing local/repair-docs &&
      mc mb --ignore-existing local/repair-backups &&
      mc anonymous set none local/repair-photos &&
      mc anonymous set none local/repair-calls &&
      mc anonymous set none local/repair-docs &&
      echo 'Бакеты созданы' &&
      exit 0
      "

  # Ловушка почты для разработки: смотреть письма на http://localhost:8025
  mailhog:
    image: mailhog/mailhog:latest
    container_name: repair-mailhog
    restart: unless-stopped
    ports:
      - '1025:1025' # SMTP
      - '8025:8025' # Web UI

volumes:
  postgres-data:
  redis-data:
  minio-data: